<style>
  /* Layout concept: full-bleed 3D model of one floor; a compact control panel floats top-left (bottom sheet on phones). */
  :root {
    --bg: #e3e7ea;
    --panel: rgba(246, 248, 249, 0.92);
    --line: rgba(22, 32, 42, 0.12);
    --fg: #16202a;
    --muted: #566370;
    --accent: #0a7a87;
    --accent-ink: #ffffff;
    --chip: rgba(22, 32, 42, 0.07);
    --chip-hover: rgba(22, 32, 42, 0.13);
    --seg-on: #ffffff;
    --scene-bg: #dde3e8;
    --scene-ground: #cbd3da;
    --is-dark: 0;
    --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1318;
      --panel: rgba(22, 29, 35, 0.92);
      --line: rgba(255, 255, 255, 0.11);
      --fg: #e6ebef;
      --muted: #9aa6b1;
      --accent: #4fc3cf;
      --accent-ink: #06222a;
      --chip: rgba(255, 255, 255, 0.08);
      --chip-hover: rgba(255, 255, 255, 0.15);
      --seg-on: #2c3842;
      --scene-bg: #0c1116;
      --scene-ground: #141b21;
      --is-dark: 1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1318;
    --panel: rgba(22, 29, 35, 0.92);
    --line: rgba(255, 255, 255, 0.11);
    --fg: #e6ebef;
    --muted: #9aa6b1;
    --accent: #4fc3cf;
    --accent-ink: #06222a;
    --chip: rgba(255, 255, 255, 0.08);
    --chip-hover: rgba(255, 255, 255, 0.15);
    --seg-on: #2c3842;
    --scene-bg: #0c1116;
    --scene-ground: #141b21;
    --is-dark: 1;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--f-body);
  }
  .stage { position: absolute; inset: 0; }
  canvas#c { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

  .status {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
    text-align: center; font: 400 0.8125rem/1.5 var(--f-mono); color: var(--muted); pointer-events: none;
  }

  .ui {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .panel {
    pointer-events: auto;
    width: 272px; max-width: 100%; max-height: 100%; overflow: auto;
    display: flex; flex-direction: column; gap: 14px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .panel.min { width: auto; max-width: none; padding: 8px 10px; gap: 0; overflow: hidden; }
  .panel.min .body { display: none; }
  .panel.min h1 { font-size: 0.95rem; }
  .panel.min .stats { display: none; }
  .head { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .head .titles { min-width: 0; }
  .toggle {
    flex: none; appearance: none; border: 0; background: var(--chip); color: var(--fg);
    width: 28px; height: 28px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .toggle:hover { background: var(--chip-hover); }
  .toggle svg { width: 14px; height: 14px; transition: transform .2s; }
  .panel.min .toggle svg { transform: rotate(180deg); }
  .body { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .panel { transition: width .2s ease; }
  .hint.fade { opacity: 0; transition: opacity .6s; }
  h1 {
    margin: 0; font: 600 1.4rem/1.1 var(--f-display); letter-spacing: -0.01em; text-wrap: balance;
  }
  .stats { margin: 6px 0 0; font: 400 0.75rem/1.45 var(--f-mono); color: var(--muted); }
  .group { min-width: 0; }
  .lab {
    display: block; font: 500 0.6875rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    appearance: none; border: 1px solid transparent; background: var(--chip); color: var(--fg);
    font: 500 0.8125rem/1 var(--f-body); padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .chips.offices { gap: 6px; }
  .chip.o {
    font: 500 0.75rem/1.15 var(--f-body); text-align: left;
    width: calc(50% - 3px); padding: 8px 8px; border-radius: 6px;
    border-left: 4px solid hsl(var(--h) 55% 52%);
  }
  .seg { display: flex; gap: 2px; margin-top: 8px; padding: 2px; border-radius: 9px; background: var(--chip); }
  .seg button {
    flex: 1; appearance: none; border: 0; background: transparent; color: var(--muted);
    font: 500 0.8125rem/1 var(--f-body); padding: 8px 6px; border-radius: 7px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hint {
    margin: 0; pointer-events: none; padding: 7px 10px; border-radius: 8px;
    font: 400 0.75rem/1.3 var(--f-mono); color: var(--muted);
    background: var(--panel); border: 1px solid var(--line);
  }
  .tip {
    position: fixed; z-index: 5; pointer-events: none; white-space: nowrap;
    padding: 5px 8px; border-radius: 6px; background: #10161c; color: #f1f4f6; font: 500 0.75rem/1.2 var(--f-mono);
  }

  @media (max-width: 700px) {
    .ui { flex-direction: column-reverse; align-items: stretch; }
    .panel { width: auto; padding: 12px; gap: 10px; max-height: 62vh; overflow: hidden; }
    .panel.min { align-self: flex-start; max-height: none; }
    .body { gap: 10px; overflow: auto; }
    .head .titles { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 1.1rem; }
    .stats { margin: 0; }
    .hint { display: none; }
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-top: 6px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; }
    .chip.o { width: auto; padding: 8px 14px 6px; }
  }
</style>

<script>
(function () {
  'use strict';

  var loading = document.getElementById('loading');
  var fail = document.getElementById('fail');
  function bail() { loading.hidden = true; fail.hidden = false; }
  if (!window.THREE || !THREE.OrbitControls) { bail(); return; }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('c');

  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
  catch (err) { bail(); return; }
  canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); bail(); }, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;

  // Rename offices here. The order is north row left to right, then south row left to right.
  var OFFICE_NAMES = [
    'Front End Dev', 'Back End Dev', 'Skill Management', 'MCP Management', 'Research Agents',
    'Memory & Context', 'QA & Testing', 'DevOps', 'Security', 'Orchestrator', 'Design & UX', 'Data & Analytics',
    'Product & Planning', 'Docs & Knowledge', 'Cost & Budget', 'Review & Approvals'
  ];

  var seed = 11;
  function rnd() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }

  // ---------- scene, camera, controls, lights ----------
  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xdde3e8, 300, 800);
  var camera = new THREE.PerspectiveCamera(42, 1, 0.8, 900);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 3;
  controls.maxDistance = 220;
  controls.screenSpacePanning = false;

  var hemi = new THREE.HemisphereLight(0xffffff, 0x8a96a3, 0.85);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(14, 70, 26);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  sun.shadow.camera.left = -46; sun.shadow.camera.right = 78;
  sun.shadow.camera.top = 62; sun.shadow.camera.bottom = -32;
  sun.shadow.camera.near = 10; sun.shadow.camera.far = 140;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0xbcd4ff, 0.25); fill.position.set(-30, 30, -20); scene.add(fill);

  // ---------- helpers ----------
  var boxGeos = {}, cylGeos = {};
  function boxGeo(w, h, d) { var k = w + '_' + h + '_' + d; return boxGeos[k] || (boxGeos[k] = new THREE.BoxGeometry(w, h, d)); }
  function cylGeo(r, h, s) { var k = r + '_' + h + '_' + s; return cylGeos[k] || (cylGeos[k] = new THREE.CylinderGeometry(r, r, h, s)); }
  function box(parent, w, h, d, m, x, y, z) {
    var o = new THREE.Mesh(boxGeo(w, h, d), m); o.position.set(x, y, z); parent.add(o); return o;
  }
  function cylinder(parent, r, h, m, x, y, z, s) {
    var o = new THREE.Mesh(cylGeo(r, h, s || 20), m); o.position.set(x, y, z); parent.add(o); return o;
  }
  function plane(parent, w, d, m, x, y, z) {
    var o = new THREE.Mesh(new THREE.PlaneGeometry(w, d), m);
    o.rotation.x = -Math.PI / 2; o.position.set(x, y, z); o.userData.floor = true; parent.add(o); return o;
  }
  var matCache = {};
  function M(hex, opt) {
    var k = hex + JSON.stringify(opt || {});
    return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color: hex, roughness: 0.8, metalness: 0 }, opt || {})));
  }
  function F(hex) {
    return new THREE.MeshStandardMaterial({ color: hex, roughness: 0.95, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  }
  function hslHex(h, s, l) { return new THREE.Color().setHSL(h / 360, s, l).getHex(); }
  var icoGeo = new THREE.IcosahedronGeometry(0.34, 1);

  // ---------- textures ----------
  function makeScreenTex(kind) {
    var c = document.createElement('canvas'); c.width = 256; c.height = 160;
    var x = c.getContext('2d');
    x.fillStyle = '#0d151c'; x.fillRect(0, 0, 256, 160);
    x.fillStyle = '#1b2833'; x.fillRect(0, 0, 256, 16);
    ['#e06c5f', '#e5b35c', '#6cc27d'].forEach(function (col, i) { x.fillStyle = col; x.beginPath(); x.arc(10 + i * 12, 8, 3.5, 0, 6.283); x.fill(); });
    var pal = ['#5ec9d6', '#cfd8df', '#e8ab5d', '#8ed48f', '#b79cf0'];
    var i, w;
    if (kind === 0) {
      for (i = 0; i < 11; i++) { var ind = (i % 4 === 1 || i % 4 === 2) ? 18 : 0; w = 30 + rnd() * 120; x.fillStyle = pal[Math.floor(rnd() * pal.length)]; x.fillRect(14 + ind, 28 + i * 12, w, 5); }
    } else if (kind === 1) {
      for (i = 0; i < 9; i++) { var bh = 20 + rnd() * 90; x.fillStyle = pal[i % 2 ? 0 : 2]; x.fillRect(20 + i * 24, 150 - bh, 16, bh); }
      x.fillStyle = '#2b3a47'; x.fillRect(14, 150, 232, 1);
    } else if (kind === 2) {
      for (i = 0; i < 6; i++) { var right = i % 2; w = 60 + rnd() * 70; x.fillStyle = right ? '#1f6f78' : '#27333f'; x.fillRect(right ? 240 - w : 14, 30 + i * 20, w, 13); }
    } else {
      for (i = 0; i < 10; i++) { x.fillStyle = '#8ed48f'; x.fillRect(14, 30 + i * 12, 6, 5); x.fillStyle = '#cfd8df'; x.fillRect(26, 30 + i * 12, 20 + rnd() * 140, 5); }
    }
    var t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }
  var screenTexs = [0, 1, 2, 3].map(makeScreenTex);

  function makeWallDisplayTex() {
    var c = document.createElement('canvas'); c.width = 640; c.height = 360;
    var x = c.getContext('2d');
    x.fillStyle = '#0d151c'; x.fillRect(0, 0, 640, 360);
    x.fillStyle = '#1b2833'; x.fillRect(0, 0, 640, 34);
    x.fillStyle = '#5ec9d6'; x.fillRect(24, 12, 120, 10);
    var i;
    for (i = 0; i < 6; i++) { x.fillStyle = i % 2 ? '#cfd8df' : '#8ed48f'; x.fillRect(32, 70 + i * 40, 40 + rnd() * 220, 12); }
    for (i = 0; i < 10; i++) { var bh = 40 + rnd() * 200; x.fillStyle = i % 3 ? '#5ec9d6' : '#e8ab5d'; x.fillRect(360 + i * 26, 330 - bh, 18, bh); }
    x.fillStyle = '#2b3a47'; x.fillRect(350, 330, 270, 2);
    var t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }

  function makeWoodTex() {
    var c = document.createElement('canvas'); c.width = 256; c.height = 256;
    var x = c.getContext('2d');
    for (var i = 0; i < 4; i++) {
      var l = 52 + Math.round(rnd() * 8);
      x.fillStyle = 'hsl(30,38%,' + l + '%)'; x.fillRect(0, i * 64, 256, 64);
      x.fillStyle = 'rgba(0,0,0,0.18)'; x.fillRect(0, i * 64, 256, 2); x.fillRect((i * 83) % 256, i * 64, 2, 64);
    }
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(16, 10); t.anisotropy = 4; return t;
  }

  var steamTex = (function () {
    var c = document.createElement('canvas'); c.width = 64; c.height = 64;
    var x = c.getContext('2d'); var g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();

  // ---------- world ----------
  var world = new THREE.Group(); scene.add(world);
  var H = 3.2;
  var walls = new THREE.Group(); world.add(walls);
  var wallItems = [];
  var screenMats = [];
  var deskCount = 0;
  var mWall = M(0xeef1f3, { roughness: 0.95 });
  var mDark = M(0x14181c, { roughness: 0.4 });
  var mLeg = M(0x2b3238, { roughness: 0.5, metalness: 0.3 });
  var mSteel = M(0xc3cbd1, { roughness: 0.35, metalness: 0.6 });
  var mWhite = M(0xffffff, { roughness: 0.5 });

  var groundMat = new THREE.MeshStandardMaterial({ color: 0xcbd3da, roughness: 1 });
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.32; ground.userData.floor = true; world.add(ground);
  box(world, 52, 0.3, 42, M(0xaab3bb), 0, -0.15, 0); box(world, 30.4, 0.3, 42, M(0xaab3bb), 40, -0.15, 0);

  function wall(x, z, w, d) { return box(walls, w, H, d, mWall, x, H / 2, z); }
  // outer shell
  wall(0, -20, 50.2, 0.2); wall(0, 20, 50.2, 0.2); wall(-25, 0, 0.2, 40);
  // east annex: two more offices; the old east wall keeps two doorways (z -7.6..-4.4 and 4.4..7.6) into the new hallway
  wall(40, -20, 30.2, 0.2); wall(40, 20, 30.2, 0.2); wall(55, -11, 0.2, 18); wall(55, 11, 0.2, 18);
  box(walls, 0.2, H - 2.4, 4, mWall, 55, 2.4 + (H - 2.4) / 2, 0); // east gate (4 m wide) for the courier robots and for people
  box(walls, 0.3, 2.4, 0.15, mDark, 55, 1.2, -2.08); box(walls, 0.3, 2.4, 0.15, mDark, 55, 1.2, 2.08); // gate posts
  (function () {
    var c = document.createElement('canvas'); c.width = 512; c.height = 96; var x = c.getContext('2d');
    x.fillStyle = '#16202a'; x.fillRect(0, 0, 512, 96); x.fillStyle = '#e8ab5d'; x.fillRect(0, 0, 10, 96); x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.font = '700 38px "IBM Plex Sans", system-ui, sans-serif'; x.fillText('TO SOCIAL MEDIA CO.  \u2192', 28, 50);
    var t = new THREE.CanvasTexture(c);
    [[55.12, Math.PI / 2], [54.88, -Math.PI / 2]].forEach(function (p) { var m = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.675), new THREE.MeshBasicMaterial({ map: t })); m.position.set(p[0], 2.78, 0); m.rotation.y = p[1]; world.add(m); });
  })();
  // annex 2 and 3 (four more offices): dividers at x=35 and x=45 get the same two doorways as x=25
  [35, 45].forEach(function (x) { wall(x, -14, 0.2, 12); wall(x, 14, 0.2, 12); wall(x, -7.8, 0.2, 0.4); wall(x, 0, 0.2, 8.8); wall(x, 7.8, 0.2, 0.4); });
  wall(25, -14, 0.2, 12); wall(25, 14, 0.2, 12); wall(25, -7.8, 0.2, 0.4); wall(25, 0, 0.2, 8.8); wall(25, 7.8, 0.2, 0.4);
  // dividers between offices
  [-15, -5, 5, 15].forEach(function (x) { wall(x, -14, 0.2, 12); wall(x, 14, 0.2, 12); });
  function doorWall(cx, z) {
    box(walls, 4.2, H, 0.2, mWall, cx - 2.9, H / 2, z);
    box(walls, 4.2, H, 0.2, mWall, cx + 2.9, H / 2, z);
    box(walls, 1.6, H - 2.3, 0.2, mWall, cx, 2.3 + (H - 2.3) / 2, z);
  }

  // corridor and lobby band under everything in the middle
  plane(world, 50, 16, F(0xcfd5da), 0, 0.015, 0); plane(world, 30, 16, F(0xcfd5da), 40, 0.015, 0);

  // ---------- chairs, desks, plants ----------
  function makeChair(fabricHex) {
    var g = new THREE.Group();
    var fab = M(fabricHex, { roughness: 0.9 });
    box(g, 0.48, 0.07, 0.46, fab, 0, 0.48, 0);
    var back = box(g, 0.46, 0.5, 0.06, fab, 0, 0.8, 0.22); back.rotation.x = 0.08;
    cylinder(g, 0.025, 0.38, mLeg, 0, 0.27, 0, 10);
    for (var k = 0; k < 5; k++) {
      var a = k * Math.PI * 2 / 5;
      var arm = box(g, 0.3, 0.03, 0.045, mLeg, Math.sin(a) * 0.15, 0.07, Math.cos(a) * 0.15);
      arm.rotation.y = a - Math.PI / 2;
    }

        body.appendChild(mk('p', 'Instagram and TikTok posting is not finished in the proxy file yet (it returns placeholder links), so those two will refuse to post.', 'color:#e8ab5d;font-size:13px'));

    }
    btn.addEventListener('click', function () { open = !open; pan.hidden = !open; if (open) render(); });

  })();

  window.__dayNight = DayNight; applyTheme();

  // ---------- live activity feed + speech bubbles ----------
  (function () {
    if (!avatarsOn) return;
    var TASKS = {
      thinking: ['Planning the next step', 'Weighing two approaches', 'Reviewing the plan', 'Breaking down a task'],
      writing: ['Drafting documentation', 'Writing a spec', 'Updating the changelog', 'Writing release notes'],
      coding: ['Refactoring a module', 'Fixing a failing test', 'Building a new endpoint', 'Optimizing a query'],
      running: ['Running the test suite', 'Running a build', 'Executing a script', 'Deploying to staging'],
      researching: ['Reading a paper', 'Searching the web', 'Checking sources', 'Comparing libraries'],
      idle: ['Waiting for a task', 'Queue is empty'],
      mcp: ['Calling an MCP tool', 'Connecting to a server', 'Registering a tool', 'Syncing a connector']
    };
    var st = document.createElement('style');
    st.textContent = '.feed{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:150px;overflow:auto}.feed .fi{appearance:none;border:0;background:var(--chip);color:var(--fg);text-align:left;font:400 .72rem/1.3 var(--f-body);padding:6px 8px;border-radius:6px;cursor:pointer}.feed .fi:hover{background:var(--chip-hover)}.feed .ft{font:400 .65rem var(--f-mono);color:var(--muted);margin-right:6px}.feed .empty{font:400 .72rem var(--f-mono);color:var(--muted)}@media (max-width:700px){.feed{max-height:90px}}';
    document.head.appendChild(st);
    var grp = el('div', 'group'); grp.appendChild(el('span', 'lab', 'Activity'));
    var list = el('div', 'feed'); list.setAttribute('aria-live', 'polite'); grp.appendChild(list);
    wallsGroup.parentNode.insertBefore(grp, wallsGroup);
    function fmt() { var s = Math.floor(T); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
    function log(A, text) {
      var b = el('button', 'fi'); b.type = 'button';
      b.appendChild(el('span', 'ft', fmt())); b.appendChild(el('b', '', A ? A.name : 'Floor')); b.appendChild(el('span', '', ' ' + text));
      if (A) b.addEventListener('click', function () { select(A); });
      list.insertBefore(b, list.firstChild);
      while (list.children.length > 30) list.removeChild(list.lastChild);
    }

      if (camera.position.distanceTo(A.root.position) > 20 && A !== selected && !(project && (A.isCeo || A.isHead))) return;
      if (!A.bub) {
        var c = document.createElement('canvas'); c.width = 384; c.height = 72;
        var tex = new THREE.CanvasTexture(c);

        sp.scale.set(1.2, 0.225, 1); sp.position.y = 2.72; sp.renderOrder = 16; A.root.add(sp);

      x.fillText(text, 192, 31, 362);
      A.bub.tex.needsUpdate = true; A.bub.sp.visible = true; A.bub.sp.material.opacity = 1; A.bub.t0 = performance.now(); A.bub.until = performance.now() + 3500;
      if (live.indexOf(A) < 0) live.push(A);
    }

      var n = performance.now();
      for (var i = live.length - 1; i >= 0; i--) if (live[i].bub.until < n) { live[i].bub.sp.visible = false; live.splice(i, 1); }
    }, 400);
    window.__feed = function (A, w) {
      if (A.lastFeed === w) return; A.lastFeed = w;
      var t = pickOne(TASKS[w]); log(A, t); bubble(A, t);
    };
    window.__feedLog = log;
    window.__bubble = bubble;
  })();

  // ---------- collapsible panel ----------
  (function () {
    var pnl = document.querySelector('.panel'), tg = document.getElementById('panelToggle'), hint = document.querySelector('.hint');
    var idleTimer = null;

  // ---------- loop ----------
